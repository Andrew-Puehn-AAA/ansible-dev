# Inventory dependant on which environment it updates
---
- name: Update all Linux servers
  hosts: azure_dev_linux_servers # Does all servers in the inventory list
  become: true
  gather_facts: true
  serial: 1

  vars:
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

  tasks:
    # 1. General OS Updates
    - name: Run apt update and upgrade
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        purge: true
        lock_timeout: 120

    # 2. Reboot if required
    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot server if required
      ansible.builtin.reboot:
        msg: "Rebooting to apply updates"
        reboot_timeout: 600
        post_reboot_delay: 30
      when: reboot_required_file.stat.exists